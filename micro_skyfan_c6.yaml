packages:
  skyfan.tuya_fan: !include
    file: tuya_fan.yaml
  skyfan.tuya_light: !include
    file: tuya_light.yaml
  skyfan.sensor_power_fan: !include
    file: sensor_power_fan.yaml
  skyfan.sensor_power_light: !include
    file: sensor_power_light.yaml
  skyfan.sensor_rssi: !include
    file: sensor_rssi.yaml

substitutions:
  device_name: easy-skyfandc
  fan_name: SkyFanDC
  light_name: SkyFanDC-Light
  skyfan_model: "SKY1203"
  fan_rssi: "SkyFanDC-RSSI"

esphome:
  name: ${device_name}
  name_add_mac_suffix: true
  project:
    name: mramage.easy_skyfandc_c6
    version: "0.1"
  on_boot:
    priority: -100
    then:
      - switch.turn_on: led
      - delay: 2s
      - switch.turn_off: led
      
esp32:
  variant: esp32c6

web_server:
  port: 80

#Dashboard import if you want to adopt the device on your esphome dashboard
dashboard_import:
  package_import_url: github://mramage/skyfandc/micro_skyfan_c6.yaml

api:

# Logger not using the serial port as tuya needs it
logger:
  baud_rate: 0

ota:
  - platform: esphome     # normal OTA method
  - platform: web_server  # web-based OTA uploads

wifi:
  ap:
    password: ""
    
captive_portal:

uart:
  rx_pin: GPIO17
  tx_pin: GPIO16
  baud_rate: 9600

tuya:
  id: tuyamcu  

switch:
  - platform: gpio
    pin:
      number: 19
      inverted: true
    id: led
